spring:
  application:
    name: store
  datasource:
    url: jdbc:mysql://localhost:3306/store?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
stripe:
  apiUrl: http://api.stripe.com
  enable: true
  timeout: 1000
  supported-currencies: USD,EUR,GBP

payment-service: stripe

server:
  port: 8081


